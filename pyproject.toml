[build-system]
# `nanobind-backend` is needed at build time as well: the `fastgpx_stub` CMake target imports
# the freshly built split-mode extension to generate the stubs.
requires = ["scikit-build-core", "nanobind>=3.0.1,<4", "nanobind-backend>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "fastgpx"
version = "0.8.0"
requires-python = ">=3.12"

# The extension is built in nanobind split mode: libnanobind comes from this package at runtime.
# No upper bound on purpose, newer backends serve older extensions:
# https://nanobind.readthedocs.io/en/latest/split_mode.html
dependencies = ["nanobind-backend>=1.0"]

description = "An experimental Python library for parsing GPX files fast."
readme = "README.md"
keywords = ["gpx", "parser", "fast"]
authors = [{ name = "Thomas Thomassen" }]
license = "MIT"

classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 3 - Alpha",

  "Intended Audience :: Developers",
  "Topic :: File Formats",

  # "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",

  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[dependency-groups]
dev = [ # Tests and build
  "gpxpy",
  "nanobind>=3.0.1,<4",
  "polyline>=2.0.4",
  "pytest",
]
benchmarks = [ #
  "colorama",
  "types-colorama",
  "lxml",
  "lxml-stubs",
]
profiling = [ #
  "colorama",
  "types-colorama",
  "snakeviz",
]
docs = [ #
  "sphinx>=8.2.3",
  "sphinx-rtd-theme>=3.0.2",
  "sphinx-autodoc-typehints>=3.5.2",
]

[project.urls]
Homepage = "https://github.com/thomthom/fastgpx"
Repository = "https://github.com/thomthom/fastgpx.git"
Documentation = "https://thomthom.github.io/fastgpx/"

[tool.scikit-build]
# https://scikit-build-core.readthedocs.io/en/latest/configuration/index.html#customizing-the-built-wheel
wheel.packages = ["src/fastgpx"]

# Build stable ABI wheels for CPython 3.12+. This is also the split-mode stable ABI floor;
# STABLE_ABI_VERSION in src/cpp/CMakeLists.txt pins the same version for plain CMake builds.
wheel.py-api = "cp312"
sdist.exclude = [".github", ".vscode", "gpx"]

# https://nanobind.readthedocs.io/en/latest/packaging.html

# Protect the configuration against future changes in scikit-build-core
minimum-version = "0.11"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# https://scikit-build-core.readthedocs.io/en/latest/configuration/index.html#configuring-cmake-arguments-and-defines
# Release rather than RelWithDebInfo. On MSVC, RelWithDebInfo uses /Ob1, which only inlines
# functions marked inline or defined in the class. Release uses /Ob2, which lets the compiler
# inline any function it chooses. And nanobind strips the Linux extension only in Release, which
# otherwise ships ~12 MB of debug info. See benchmarks/build_settings.md.
cmake.build-type = "Release"

# No cmake.define table here on purpose. The tests are left out of the wheel by CMakeLists.txt,
# which defaults BUILD_TESTING to off when scikit-build-core drives the build, so no define is
# needed for that and a platform override below cannot accidentally drop it.

# Link-time optimization for the Linux wheels. Production runs on Linux. It pays off only
# because pugixml and the core library are built with hidden visibility (src/cpp/CMakeLists.txt),
# which lets GCC inline pugixml into the parse loop inside the extension. Not on Windows, where it
# made polyline decoding slower. See benchmarks/review_decisions.md.
# FASTGPX_LTO asks for it only if the compiler supports it (CheckIPOSupported), so a build from the
# sdist with a compiler that cannot do it warns and builds without it instead of failing.
[[tool.scikit-build.overrides]]
if.platform-system = "^linux"
# An override's cmake.define replaces the base table unless it appends. The base table is empty
# today, so nothing depends on this, but any define added there later reaches Linux too.
inherit.cmake.define = "append"
cmake.define.FASTGPX_LTO = "ON"
